<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario FIT di Davide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        #login-screen {
            text-align: center;
        }
        #app-screen {
            display: none;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--accent);
        }
        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-style: italic;
        }
        input[type="password"], input[type="text"], textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .quick-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background-color: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .saved-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .saved-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }
        .saved-item .date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <h1>Diario FIT di Davide</h1>
            <div class="subtitle">da un'idea di Paolo Di Caro</div>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Inserisci la password per accedere al diario:</p>
            <input type="password" id="password-input" placeholder="Password protetta">
            <button onclick="checkPassword()">Accedi</button>
            <div id="error-msg" class="error-msg">Password errata. Riprova.</div>
        </div>

        <!-- APP SCREEN -->
        <div id="app-screen">
            <h1>Diario FIT by Davide</h1>
            <div class="subtitle">da un'idea di Paolo Di Caro</div>
            
            <div class="section-title">Tasti Rapidi (Inserimento Veloce)</div>
            <div class="quick-buttons">
                <button class="quick-btn" onclick="addText('3 uova sode con integratori')">🥚 3 Uova Sode</button>
                <button class="quick-btn" onclick="addText('Caffè')">☕ Caffè</button>
                <button class="quick-btn" onclick="addText('Semi di zucca')">🌱 Semi di Zucca</button>
                <button class="quick-btn" onclick="addText('Grissini ai semi')">🥖 Grissini ai Semi</button>
                <button class="quick-btn" onclick="addText('Pre-workout (Citrullina, Betaina, Beta-alanina)')">⚡ Pre-workout</button>
                <button class="quick-btn" onclick="addText('Post-workout (100g Whey)')">💪 Post-workout (100g Whey)</button>
            </div>

            <div class="section-title">Nuova Registrazione</div>
            <textarea id="entry-text" placeholder="Scrivi qui o usa i tasti rapidi..."></textarea>
            <button onclick="saveEntry()">Salva nel Diario</button>

            <div class="saved-list" id="saved-list">
                <div class="section-title" style="border:none; margin-bottom:5px;">Storico Recente</div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PWD = atob("Smg1NDM2JV55ajw=");

        function checkPassword() {
            const pwd = document.getElementById('password-input').value;
            if (pwd === CORRECT_PWD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                loadEntries();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function addText(text) {
            const textarea = document.getElementById('entry-text');
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const addition = `[${timestamp}] ${text}\n`;
            textarea.value += (textarea.value ? "\n" : "") + addition;
        }

        function saveEntry() {
            const text = document.getElementById('entry-text').value.trim();
            if (!text) return;
            
            const entries = JSON.parse(localStorage.getItem('diario_davide_entries') || '[]');
            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            entries.unshift({ date: dateStr, content: text });
            localStorage.setItem('diario_davide_entries', JSON.stringify(entries));
            
            document.getElementById('entry-text').value = '';
            loadEntries();
        }

        function loadEntries() {
            const listEl = document.getElementById('saved-list');
            const entries = JSON.parse(localStorage.getItem('diario_davide_entries') || '[]');
            
            let html = '<div class="section-title" style="border:none; margin-bottom:5px;">Storico Recente</div>';
            if (entries.length === 0) {
                html += '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">Nessuna voce salvata.</div>';
            } else {
                entries.forEach(entry => {
                    html += `<div class="saved-item">
                        <div class="date">${entry.date}</div>
                        <div style="white-space: pre-wrap;">${entry.content}</div>
                    </div>`;
                });
            }
            listEl.innerHTML = html;
        }
    </script>
</body>
</html>
