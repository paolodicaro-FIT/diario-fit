<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Fit & Nutrizione</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --accent-color: #bb86fc;
            --accent-hover: #9955fe;
            --border-color: #333333;
            --water-color: #03a9f4;
            --danger-color: #cf6679;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            line-height: 1.25;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1, h2 {
            color: var(--accent-color);
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .totals {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .total-box {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .total-box span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        th {
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
            text-align: center;
            border: none;
            width: 100%;
            padding: 12px;
            margin-top: 5px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Diario Fit</h1>

        <!-- TOTALS -->
        <div class="card">
            <h2>📊 Totali Giornalieri</h2>
            <div class="totals">
                <div class="total-box">Kcal<span id="totKcal">0</span></div>
                <div class="total-box">Pro (g)<span id="totPro">0</span></div>
                <div class="total-box">Grassi (g)<span id="totFat">0</span></div>
            </div>
            <div class="totals" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 0;">
                <div class="total-box">Carbo (g)<span id="totCarb">0</span></div>
                <div class="total-box" style="border-color: var(--water-color);">Acqua (ml)<span id="totWater" style="color: var(--water-color);">0</span></div>
            </div>
        </div>

        <!-- QUICK ADD -->
        <div class="card">
            <h2>⚡ Inserimento Rapido</h2>
            <div class="quick-buttons">
                <button onclick="addQuick('Shaker Whey (2 cup Whey + 1 mis. Creatina + 500ml H2O)', 200, 40, 2, 3, 500)">🥤 Shaker Whey (2 cup + Creatina + 500ml H2O)</button>
                <button onclick="addQuick('Shaker Post-Workout (1 Cup Whey + 300ml H2O)', 100, 20, 1, 1.5, 300)">🥤 Shaker Post-Workout (1 Cup + 300ml H2O)</button>
                <button onclick="addQuick('Shaker Pre-Workout (Citrullina + Beta-Alanina + Betaina + 400ml H2O)', 0, 0, 0, 0, 400)">⚡ Pre-Workout (+ 400ml H2O)</button>
                <button onclick="addQuick('Noci Macadamia (10 pz / ~25g)', 180, 2, 19, 3)">🌰 Noci Macadamia (10 pz)</button>
                <button onclick="addQuick('Yogurt Greco 0% (150g) + Whey (1 cup)', 160, 23, 0, 8)">🥣 Yogurt Greco 0% + Whey</button>
                <button onclick="addQuick('Fiocchi di Latte (200g)', 180, 24, 8, 3)">🧀 Fiocchi di Latte (200g)</button>
                <button onclick="addQuick('Mirtilli (250g)', 140, 2, 1, 35)">🫐 Mirtilli Fresh (250g)</button>
                <button onclick="addQuick('Mocaccino s/z (1 tazza)', 30, 1, 1, 4)">☕ Mocaccino s/z</button>
                <button onclick="addQuick('Acqua (+500ml)', 0, 0, 0, 0, 500)" style="border-color: var(--water-color);">💧 Acqua (+500ml)</button>
            </div>
        </div>

        <!-- MANUAL ADD -->
        <div class="card">
            <h2>➕ Inserimento Manuale</h2>
            <div class="form-group">
                <label for="desc">Alimento / Bevanda</label>
                <input type="text" id="desc" placeholder="Es. Petto di pollo">
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <div class="form-group">
                    <label for="kcal">Kcal</label>
                    <input type="number" id="kcal" value="0">
                </div>
                <div class="form-group">
                    <label for="pro">Proteine (g)</label>
                    <input type="number" id="pro" value="0" step="0.1">
                </div>
                <div class="form-group">
                    <label for="fat">Grassi (g)</label>
                    <input type="number" id="fat" value="0" step="0.1">
                </div>
                <div class="form-group">
                    <label for="carb">Carboidrati (g)</label>
                    <input type="number" id="carb" value="0" step="0.1">
                </div>
            </div>
            <div class="form-group">
                <label for="water">Acqua (ml)</label>
                <input type="number" id="water" value="0">
            </div>
            <button class="btn-primary" onclick="addManual()">Aggiungi al Diario</button>
        </div>

        <!-- LOG LIST -->
        <div class="card">
            <h2>📝 Storico di Oggi</h2>
            <div style="overflow-x: auto;">
                <table id="logTable">
                    <thead>
                        <tr>
                            <th>Alimento</th>
                            <th>Kcal</th>
                            <th>P</th>
                            <th>G</th>
                            <th>C</th>
                            <th>H2O</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="logBody">
                        <!-- Voci dinamiche -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let logData = JSON.parse(localStorage.getItem('diario_fit_log')) || [];

        function saveAndRender() {
            localStorage.setItem('diario_fit_log', JSON.stringify(logData));
            renderTable();
            updateTotals();
        }

        function addQuick(desc, kcal, pro, fat, carb, water) {
            logData.push({ desc, kcal, pro, fat, carb, water });
            saveAndRender();
        }

        function addManual() {
            const desc = document.getElementById('desc').value.trim();
            const kcal = parseFloat(document.getElementById('kcal').value) || 0;
            const pro = parseFloat(document.getElementById('pro').value) || 0;
            const fat = parseFloat(document.getElementById('fat').value) || 0;
            const carb = parseFloat(document.getElementById('carb').value) || 0;
            const water = parseFloat(document.getElementById('water').value) || 0;

            if (!desc) {
                alert("Inserisci il nome dell'alimento o della bevanda.");
                return;
            }

            logData.push({ desc, kcal, pro, fat, carb, water });
            
            // Reset campi form
            document.getElementById('desc').value = '';
            document.getElementById('kcal').value = '0';
            document.getElementById('pro').value = '0';
            document.getElementById('fat').value = '0';
            document.getElementById('carb').value = '0';
            document.getElementById('water').value = '0';

            saveAndRender();
        }

        function removeItem(index) {
            logData.splice(index, 1);
            saveAndRender();
        }

        function renderTable() {
            const tbody = document.getElementById('logBody');
            tbody.innerHTML = '';

            if (logData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Nessun inserimento oggi.</td></tr>';
                return;
            }

            logData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.desc}</td>
                    <td>${item.kcal}</td>
                    <td>${item.pro}</td>
                    <td>${item.fat}</td>
                    <td>${item.carb}</td>
                    <td>${item.water ? item.water + 'ml' : '-'}</td>
                    <td><button class="delete-btn" onclick="removeItem(${index})">✖</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateTotals() {
            let totKcal = 0, totPro = 0, totFat = 0, totCarb = 0, totWater = 0;

            logData.forEach(item => {
                totKcal += item.kcal || 0;
                totPro += item.pro || 0;
                totFat += item.fat || 0;
                totCarb += item.carb || 0;
                totWater += item.water || 0;
            });

            document.getElementById('totKcal').innerText = totKcal;
            document.getElementById('totPro').innerText = totPro.toFixed(1);
            document.getElementById('totFat').innerText = totFat.toFixed(1);
            document.getElementById('totCarb').innerText = totCarb.toFixed(1);
            document.getElementById('totWater').innerText = totWater;
        }

        // Inizializzazione pagina al caricamento
        window.onload = function() {
            renderTable();
            updateTotals();
        };
    </script>
</body>
</html>
