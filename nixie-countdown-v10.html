<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><title>Nixie Countdown V10</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#cf8a72;font-family:Arial,sans-serif}body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 12px 64px;background:radial-gradient(ellipse at center,#100303 0%,#000 75%)}main{width:min(100%,560px);display:flex;flex-direction:column;gap:clamp(12px,3dvh,28px)}.group{display:flex;justify-content:center;gap:clamp(5px,2vw,16px)}.tube{flex:1;min-width:0;max-width:180px;aspect-ratio:.75;position:relative}.tube:before{content:"";position:absolute;inset:2% 8%;background:radial-gradient(ellipse,#180b0a 0%,#0a0505 56%,transparent 75%);border-radius:45%;pointer-events:none}.tube svg{width:100%;height:100%;position:relative;overflow:visible}.caption{text-align:center;font-size:clamp(10px,2.5vw,14px);letter-spacing:.3em;margin-top:3px;color:#9f6556}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,4vw,28px)}.bottom .group{gap:clamp(4px,1.5vw,12px)}.bottom .caption{letter-spacing:.14em}.title{text-align:center;font-size:clamp(13px,3vw,17px);letter-spacing:.13em;color:#b98b7b;overflow-wrap:anywhere}.title:empty{display:none}#gear{position:fixed;right:15px;bottom:calc(14px + env(safe-area-inset-bottom));border:1px solid #502a23;border-radius:50%;width:44px;height:44px;background:#110606;color:#e08b6c;font-size:24px;opacity:.75}dialog{width:min(92vw,390px);border:1px solid #9e5339;border-radius:15px;background:#170c0a;color:#ffd5b6;padding:22px;box-shadow:0 0 0 100vmax #000c}dialog h2{margin-top:0}label{display:block;margin-top:14px;margin-bottom:5px}input{width:100%;font:inherit;padding:12px;color:white;background:#291711;border:1px solid #855039;border-radius:8px}dialog button{padding:11px;margin:15px 6px 0 0;border-radius:8px;border:1px solid #a96545;background:#592a1c;color:white}#done{text-align:center}.hidden{display:none}@media(max-height:720px){main{max-width:420px;gap:9px}.tube{aspect-ratio:.95}}@media(min-width:800px){main{max-width:480px}}@media (orientation:landscape) and (max-height:650px){body{height:100dvh;min-height:0;padding:5px 48px 5px 10px;overflow:hidden}main{width:100%;max-width:none;height:100%;display:grid;grid-template-columns:1.5fr 1.1fr 1fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:6px;align-items:center}main>section,main>.bottom,main>.bottom>section{min-height:0;height:100%;display:flex;flex-direction:column;justify-content:center}main>.bottom{display:contents}main>.bottom>section{min-width:0}.group,.bottom .group{min-height:0;flex:1;gap:3px;align-items:center}.tube{flex:1;max-width:none;width:0;height:min(72dvh,100%);aspect-ratio:auto}.tube svg{height:100%;width:100%}.caption,.bottom .caption{flex:0 0 auto;font-size:10px;letter-spacing:.12em;margin:0}.title{grid-column:1/-1;grid-row:2;font-size:12px;margin:0}#gear{right:8px;bottom:12px;width:36px;height:36px;font-size:19px}#done{display:none}} </style></head><body>
<main><section><div id="days" class="group"></div><div class="caption">GIORNI</div></section><section><div id="hours" class="group"></div><div class="caption">ORE</div></section><div class="bottom"><section><div id="minutes" class="group"></div><div class="caption">MINUTI</div></section><section><div id="seconds" class="group"></div><div class="caption">SECONDI</div></section></div><div class="title" id="title"></div><div id="done" class="hidden">Evento raggiunto!</div></main><button id="gear" aria-label="Impostazioni">⚙</button><dialog id="settings"><h2>Imposta evento</h2><label for="event">Nome evento</label><input id="event" placeholder="Immersioni a Vulcano"><label for="date">Data e ora</label><input type="datetime-local" id="date"><div><button id="save">Salva</button><button id="full">⛶ Schermo intero</button><button id="close">Chiudi</button></div></dialog>
<script>const paths=["M50 14 C27 14 23 37 23 62 L23 100 C23 126 28 146 50 146 C72 146 77 126 77 100 L77 62 C77 37 73 14 50 14 Z","M30 43 L52 17 L52 145","M22 44 C22 23 35 14 52 14 C73 14 79 30 77 48 C74 70 58 87 22 145 L80 145","M23 34 C31 18 43 14 55 14 C72 14 78 27 76 45 C74 64 60 76 45 77 C63 77 78 88 78 108 C78 131 66 146 49 146 C33 146 24 138 20 124","M70 145 L70 15 L19 104 L83 104","M77 16 L30 16 L24 75 C34 66 44 64 54 65 C73 66 80 81 79 104 C78 130 66 146 47 146 C31 146 23 137 19 125","M72 22 C59 12 42 15 32 30 C20 48 21 85 23 112 C25 137 36 146 52 146 C72 146 80 131 78 109 C76 88 64 79 48 80 C35 81 26 90 23 104","M18 17 L81 17 L39 145","M50 77 C31 76 22 62 23 45 C24 25 35 14 50 14 C68 14 78 27 77 46 C76 65 66 76 50 77 C30 78 21 91 22 111 C23 133 34 146 50 146 C68 146 79 132 78 111 C77 91 68 79 50 77","M76 60 C72 73 63 81 49 80 C32 79 22 65 22 47 C22 27 34 14 51 14 C72 14 78 32 78 57 L78 102 C78 128 66 146 46 146 C34 146 26 140 22 130"];const ns='http://www.w3.org/2000/svg';let serial=0;function node(tag,a={}){let n=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(a))n.setAttribute(k,v);return n}function digit(n){let box=document.createElement('div');box.className='tube';let svg=node('svg',{viewBox:'0 0 100 160'}),id='glow'+serial++,defs=node('defs'),filter=node('filter',{id,x:'-100%',y:'-80%',width:'300%',height:'260%'});filter.append(node('feGaussianBlur',{stdDeviation:'6'}));defs.append(filter);svg.append(defs);let off=node('g',{fill:'none',stroke:'#81564d','stroke-width':'0.72',opacity:'.36','stroke-linecap':'round','stroke-linejoin':'round'});paths.forEach((d,i)=>{if(i!==n){let p=node('path',{d,transform:'translate('+((i%3-1)*0.8)+' '+((i%4-2)*0.45)+')'});off.append(p)}});svg.append(off);let d=paths[n];svg.append(node('path',{d,fill:'none',stroke:'#f3290a','stroke-width':'12',opacity:'.9',filter:'url(#'+id+')'}));svg.append(node('path',{d,fill:'none',stroke:'#ff461d','stroke-width':'2.3','stroke-linecap':'round','stroke-linejoin':'round'}));svg.append(node('path',{d,fill:'none',stroke:'#ffe2a4','stroke-width':'.9','stroke-linecap':'round','stroke-linejoin':'round'}));box.append(svg);return box}function display(id,v,min){let x=document.getElementById(id),s=String(v).padStart(min,'0');if(x.dataset.val===s)return;x.dataset.val=s;x.replaceChildren(...[...s].map(c=>digit(+c)))}let now=new Date(),initial=new Date(now.getFullYear()+1,5,10,12);function fmt(d){let p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}let target=fmt(initial),eventName='';try{let s=null;for(let k of ['nixie-countdown-v5','nixie-countdown-v6','nixie-countdown-v7','nixie-countdown-v8','nixieCountdown','nixie-countdown']){try{let v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object'&&(v.date||v.target||v.datetime)){s=v;break}}catch{}}if(s){target=s.date||s.target||s.datetime||target;eventName=s.name||s.title||s.event||''}}catch{}let date=document.getElementById('date'),ev=document.getElementById('event'),dlg=document.getElementById('settings');date.value=target;ev.value=eventName;document.getElementById('title').textContent=eventName;function tick(){let ms=new Date(target).getTime()-Date.now(),r=Math.max(0,Math.ceil(ms/1000));display('days',Math.floor(r/86400),3);display('hours',Math.floor(r%86400/3600),2);display('minutes',Math.floor(r%3600/60),2);display('seconds',r%60,2);document.getElementById('done').classList.toggle('hidden',r!==0)}document.getElementById('gear').onclick=()=>dlg.showModal();document.getElementById('close').onclick=()=>dlg.close();document.getElementById('save').onclick=()=>{if(!date.value||isNaN(new Date(date.value).getTime()))return alert('Inserisci una data valida');target=date.value;eventName=ev.value.trim();document.getElementById('title').textContent=eventName;try{localStorage.setItem('nixie-countdown-v5',JSON.stringify({date:target,name:eventName}))}catch{}dlg.close();tick()};document.getElementById('full').onclick=async()=>{dlg.close();try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Per lo schermo intero prova ad aggiungere la pagina alla schermata Home.')}};tick();setInterval(tick,1000);</script></body></html>
